syntax="proto3";

package distcomment;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";


service DistCommentService {
    rpc GetInitialCommentData (CommentPostId) returns (ListComments);
    rpc GetOtherCommentData (CommentPostIdAndId) returns (ListComments);
    rpc CreateNewComment (CreateNewCommentData) returns (CommentProto);
    rpc UpdateComment (UpdateCommentData) returns (CommentProto);
    rpc DeleteComment (DeleteCommentData) returns (google.protobuf.Empty);
    rpc GetCountofLike (GetidsPosts) returns (ReturnCountComment);
}



message CommentPostId {
    int32 postId = 1;
}

message CommentPostIdAndId {
    int32 postId = 1;
    int32 lastId = 2;
}


message CommentProto {
    int32 id = 1;
    int32 userId = 2;
    int32 postId = 3;
    string content = 4;
    google.protobuf.Timestamp createdAt = 5;
    google.protobuf.Timestamp updatedAt = 6;
}

message ListComments {
    repeated CommentProto comments = 1;
}

message CreateNewCommentData {
    int32 userId = 1;
    int32 postId = 2;
    string content = 3;
}


message UpdateCommentData {
    int32 id = 1;
    int32 userId = 2;
    string content = 4;
}

message DeleteCommentData {
    int32 id = 1;
    int32 userId = 2;
}


message GetidsPosts {
    repeated int32 postIds = 1;
}

message ReturnCountComment {
    map<int32, int32> comments = 1;
}